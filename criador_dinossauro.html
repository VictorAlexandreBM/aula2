<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    <!-- header -->
    <header>
        <div class="container">
            <img src="images/jp_topoLogotipo.png" id="logoImg">

            <!-- links -->
            <nav>
                <a class="nav_link" href="#section1">Filmes</a> |
                <a class="nav_link" href="#section2">Prêmios</a> |
                <a class="nav_link" href="login.html">Administrativo</a> |
                <a class="nav_link" href="criador_dinossauro.html">Criador de dinossauro</a>
            </nav>        
        </div>     
    </header>

    <!-- section 1 -->
    <section id="section1">
        <div class="container">
            <div id="sec1Heading">
                <h1>Criador de Dinossauro</h1>
            </div>
            

            <div class="card">
                <div class="film_description_container">
                    
                    <label for="inputNome1">Digite a primeira sílaba do seu nome </label>
                    <input type="text" id="inputNome1" placeholder="Digite a primeira sílaba do seu nome">

                    <label for="inputNome2">Digite a última sílaba do seu nome </label>
                    <input type="text" id="inputNome2" placeholder="Digite a última sílaba do seu nome">

                    <label for="inputNome3">Digite a primeira sílaba do seu sobrenome </label>
                    <input type="text" id="inputNome3" placeholder="Digite a primeira sílaba do seu sobrenome">

                    <label for="inputNome4">Digite a última sílaba do seu sobrenome </label>
                    <input type="text" id="inputNome4" placeholder="Digite a última sílaba do seu sobrenome">
                    
                    <button> Criar nome </button>
                </div>
            </div>

        </div>
    </section>
    
    <section id="section2" class="escondido">
        <h1 id="sec2Heading">Seu nome é: </h1>
            <h2 id="nomeDinossauro">sauro</h2>
    </section>


    <!-- footer -->
    <footer>
        <div class="container">
            JURASSIC PAGE O seu canal de informações sobre Jurassic Park
        </div>
        
    </footer>
</body>
</html>

<script>
    const inputNome1 = document.getElementById('inputNome1');
    const inputNome2 = document.getElementById('inputNome2');
    const inputNome3 = document.getElementById('inputNome3');
    const inputNome4 = document.getElementById('inputNome4');
    const button = document.querySelector('button');
    const section2 = document.getElementById('section2');
    const nomeDinossauro = document.getElementById('nomeDinossauro');

    button.addEventListener('click', function(){
        if (!verificarNome()){
            return;
        };
        section2.classList.remove('escondido');
        nomeDinossauro.innerText = inputNome1.value + inputNome4.value + inputNome3.value + inputNome2.value + 'sauro';
    });

    function verificarNome(){
        if(inputNome1.value && inputNome2.value && inputNome3.value && inputNome4.value){
            return true;
        }
        alert('Preencha todos os campos');
        return false;
    }
</script>
